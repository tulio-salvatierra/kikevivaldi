<!doctype html>
<!--
  Source for public/og-kikevivaldy.jpg (1200x630 social card).

  To regenerate: open this file in a browser at exactly 1200x630 and capture it,
  or screenshot it headlessly (Playwright/Puppeteer) to public/og-kikevivaldy.jpg.
  Keeping the template in the repo means the card can be re-rendered when the
  copy or palette changes, instead of being an unreproducible binary.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Big Shoulders Display";
        font-weight: 800;
        src: url("../node_modules/@fontsource/big-shoulders-display/files/big-shoulders-display-latin-800-normal.woff2")
          format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-weight: 400;
        src: url("../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2")
          format("woff2");
      }

      :root {
        --ink: 12 10 8;
        --ember: 166 107 68;
        --cream: 232 222 215;
        --cream-dim: 192 162 138;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        background: rgb(var(--ink));
      }

      .shot {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 42%;
      }

      /* Dark wash from the left so the type stays legible and off his face. */
      .scrim {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            to right,
            rgb(var(--ink) / 0.94) 0%,
            rgb(var(--ink) / 0.82) 30%,
            rgb(var(--ink) / 0.34) 62%,
            rgb(var(--ink) / 0.08) 100%
          ),
          linear-gradient(to top, rgb(var(--ink) / 0.45), transparent 55%);
      }

      .copy {
        position: absolute;
        inset: 0;
        padding: 0 70px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .mono {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        text-transform: uppercase;
      }

      .eyebrow {
        font-size: 15px;
        letter-spacing: 0.22em;
        color: rgb(var(--ember));
        margin-bottom: 30px;
      }

      .name {
        font-family: "Big Shoulders Display", Impact, sans-serif;
        font-weight: 800;
        font-size: 122px;
        line-height: 0.85;
        letter-spacing: -0.01em;
        text-transform: uppercase;
      }
      .name.first { color: rgb(var(--cream)); }
      .name.last { color: rgb(var(--ember)); }

      .rule {
        width: 82px;
        height: 2px;
        background: rgb(var(--ember));
        margin: 40px 0 26px;
      }

      .footer {
        font-size: 15px;
        letter-spacing: 0.18em;
        color: rgb(var(--cream-dim));
      }
    </style>
  </head>
  <body>
    <img class="shot" src="../public/media/hero-poster.jpg" alt="" />
    <div class="scrim"></div>
    <div class="copy">
      <div class="mono eyebrow">Colombian guitarist</div>
      <div class="name first">Kike</div>
      <div class="name last">Vivaldy</div>
      <div class="rule"></div>
      <div class="mono footer">Nova Flamenco &middot; kikevivaldy.com</div>
    </div>
  </body>
</html>
